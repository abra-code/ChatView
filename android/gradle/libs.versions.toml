## Version catalog for the Android port of ChatView.
##
## The toolchain (agp / kotlin / composeBom / kotlinx-serialization / wrapper) mirrors ActionUIAndroid, the
## ultimate consumer via :addon-chat, so the composite build - ChatView includeBuild RichText + AsyncImageCache,
## and ActionUIAndroid includeBuild all three - resolves against one pinned toolchain at the final app. Runtime
## dependencies are limited to the OS SDK + Kotlin stdlib + kotlinx-coroutines + kotlinx-serialization +
## AndroidX/Compose (material-icons-extended is AndroidX and allowed) + the sibling RichText / AsyncImageCache
## libraries. No OkHttp, no Ktor, no markdown libs, no Coil/Glide. Test scope adds only JUnit +
## kotlinx-coroutines-test + the AndroidX/Compose test runner.
##
## That no-OkHttp rule is scoped to :chatview, the component every host links. :chatview-acp is the sanctioned
## exception (remote-agent plan 3.4): a WebSocket transport either links a hardened client or hand-rolls RFC 6455
## - framing, masking, fragmentation, ping/pong, close handshake, TLS - and java.net.http.HttpClient does not
## exist on Android. OkHttp stays implementation-scoped inside that one module, so a host that never links
## :chatview-acp never pulls it, exactly like a Swift host that never links ChatViewACP.

[versions]
agp = "9.3.1"
kotlin = "2.2.10"
kotlinxSerialization = "1.7.3"
coroutines = "1.10.2"
androidxCore = "1.18.0"
composeBom = "2026.02.01"
activityCompose = "1.10.1"
lifecycle = "2.7.0"
# :chatview-acp only (the WebSocket transport module; see the header). mockwebserver3 ships in the same release
# train as okhttp, so the two stay on one version.
okhttp = "5.1.0"
# Test scope only (never ships).
junit = "4.13.2"
androidxTestExtJunit = "1.1.5"
androidxTestRunner = "1.5.2"
androidxTestCore = "1.5.0"
espresso = "3.5.1"

[libraries]
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

# The WebSocket client for :chatview-acp (implementation-scoped there; never seen by :chatview).
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Sibling standalone libraries, resolved to their local composite builds (see settings.gradle.kts). Same
# coordinates the Swift package depends on. Referenced by string coordinate in :chatview (the includeBuild
# substitution matches on the coordinate), so they carry no catalog alias here; the versions are pinned by the
# sibling builds themselves (both 0.1.0).

# Compose - versions managed by the BOM, so the individual artifacts carry no explicit version.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Test.
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockwebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
